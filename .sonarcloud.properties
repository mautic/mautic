# Bootstrap 3 Sass sources are compatibility/vendor code. SonarCloud's CSS
# rules flag Sass imports, global Bootstrap selectors, and intentional legacy
# browser fallbacks as bugs. Keep these two files covered by the Sass build and
# visual compatibility checks, but exclude them from SonarCloud's CSS analysis.
sonar.exclusions=app/bundles/CoreBundle/Assets/css/libraries/bootstrap/_bootstrap.scss,app/bundles/CoreBundle/Assets/css/libraries/bootstrap/_bootstrap-3-compatibility.scss
