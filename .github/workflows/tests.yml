name: Mautic tests and validations

on:
  push:
    branches:
      - '[0-9].*'
  pull_request:
  merge_group:
  schedule:
    # Run every day at 10:45 AM UTC to discover potential issues with dependencies like PHP updates etc.
    - cron: '45 10 * * *'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  phpunit:
    # We don't want the scheduled jobs to run on forks of Mautic
    if: (github.event_name == 'schedule' && (github.repository == 'mautic/mautic' || github.repository == 'mautic/api-library') ) || (github.event_name != 'schedule')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - php-versions: '8.2'
            db-types: 'mysql:8.4'
          - php-versions: '8.2'
            db-types: 'mariadb:10.11'
          - php-versions: '8.5'
            db-types: 'mysql:9.2'
          - php-versions: '8.5'
            db-types: 'mariadb:11.4'
          - php-versions: '8.6'
            db-types: 'mysql:26.7' # 'mysql:9.7'
            experimental: true
          - php-versions: '8.6'
            db-types: 'mariadb:13.0-rc' # 'mariadb:12.3'
            experimental: true

    name: PHPUnit ${{ matrix.php-versions }} ${{ matrix.db-types }}

    env:
      # Collecting coverage roughly doubles the runtime of this job (~10 min -> ~19 min), so we only
      # do it where the report is actually uploaded: on the mautic/mautic repository, for merges and
      # for the nightly schedule. Pull requests skip it, which also stops fork PRs from generating a
      # coverage report that is then discarded.
      COVERAGE: ${{ matrix.php-versions == '8.2'
        && matrix.db-types == 'mariadb:10.11'
        && github.repository == 'mautic/mautic'
        && (github.event_name == 'push' || github.event_name == 'schedule') }}

    services:
      database:
        image: ${{ matrix.db-types }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: mautictest
        ports:
          - 3306
        options: >-
          --shm-size=2gb
          --tmpfs=/var/lib/mysql
          --health-cmd "${{ startsWith(matrix.db-types, 'mysql:') && 'mysqladmin ping' || 'healthcheck.sh --connect --innodb_initialized' }}"
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=3
      saml:
        image: kenchan0130/simplesamlphp
        env:
          SIMPLESAMLPHP_SP_ENTITY_ID: https://localhost
          SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: https://localhost/s/saml/login_check
          SIMPLESAMLPHP_IDP_BASE_URL: http://localhost:8086/simplesaml/ # NOSONAR
        ports:
          - 8086:8080

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Codecov needs access to previous commits, so we add fetch-depth: 0
      with:
        fetch-depth: 0

    - name: PHPUnit cache
      if: ${{matrix.php-versions == '8.2' && matrix.db-types == 'mariadb:10.11'}}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./var/cache/phpunit
        key: ${{ runner.os }}-phpunit-${{ hashFiles('**/composer.lock') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-phpunit-${{ hashFiles('**/composer.lock') }}
          ${{ runner.os }}-phpunit-

    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, pdo_mysql
        coverage: pcov
        ini-values: pcov.enabled=0, pcov.directory=., pcov.exclude="~tests|themes|vendor~", zend.assertions=1

    - name: Install mysql client
      run: sudo apt-get update && sudo apt-get install -y mysql-client

    - name: add MySQL config file
      run: |
        mysqldump --version
        mysqldump --print-defaults
        cp .github/ci-files/.my.cnf ~/.my.cnf
        mysqldump --print-defaults
        DB_LOG_NAME="${{ matrix.db-types }}"
        echo "DB_LOG_NAME=${DB_LOG_NAME/:/_}" >> $GITHUB_ENV

    - name: Set SYMFONY_ENV to test
      run: |
        echo "SYMFONY_ENV=test" >> $GITHUB_ENV
        echo "MAUTIC_ENV=test" >> $GITHUB_ENV

    - name: Install dependencies
      uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
      with:
        # Conditionally appends ignore platform rules ONLY for PHP 8.6 dev runs
        composer-options: ${{ matrix.php-versions == '8.6' && '--ignore-platform-reqs' || '' }}

    - name: Run tests - database = ${{ matrix.db-types }}
      continue-on-error: ${{ matrix.experimental == true }}
      run: |
        rm -rf var/cache
        export DB_DRIVER="pdo_mysql"
        export DB_CHARSET="utf8mb4"
        export DB_PORT="${{ job.services.database.ports[3306] }}"
        export SAML_PORT="${{ job.services.saml.ports[8080] }}"

        if [[ "$COVERAGE" == "true" ]]; then
          php -d zend.assertions=1 -d pcov.enabled=1 bin/phpunit -d memory_limit=3G --bootstrap vendor/autoload.php --configuration app/phpunit.xml.dist --coverage-clover=coverage.xml --log-junit=junit.xml
        else
          php -d zend.assertions=1 bin/phpunit -d memory_limit=2G --bootstrap vendor/autoload.php --configuration app/phpunit.xml.dist
        fi

    - name: Upload coverage report
      if: ${{ env.COVERAGE == 'true' }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Save test results for future steps
      if: ${{ env.COVERAGE == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results
        path: |
          ./junit.xml
          ./coverage.xml

    - name: Slack Notification if tests fail
      uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2
      if: ${{ failure() && github.event_name == 'schedule' }}
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_MESSAGE: 'The daily GitHub Actions tests in mautic/mautic have failed. Most likely something external has changed, like a PHP version update.'

    - name: Store log artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: logs-${{ matrix.php-versions }}-${{ env.DB_LOG_NAME }}
        path: ./var/logs/*

  phpunit-postgres:
    # Same gating as the main phpunit job
    if: (github.event_name == 'schedule' && (github.repository == 'mautic/mautic' || github.repository == 'mautic/api-library') ) || (github.event_name != 'schedule')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - php-versions: '8.2'
            postgres-versions: '16'
          - php-versions: '8.5'
            postgres-versions: '18'
          - php-versions: '8.6'
            postgres-versions: '19beta3-alpine'
            experimental: true

    name: PHPUnit ${{ matrix.php-versions }} postgres:${{ matrix.postgres-versions }}

    services:
      postgres:
        image: postgres:${{ matrix.postgres-versions }}
        env:
          POSTGRES_DB: mautictest
          POSTGRES_USER: mautic
          POSTGRES_PASSWORD: mautic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mautic -d mautictest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      saml:
        image: kenchan0130/simplesamlphp
        env:
          SIMPLESAMLPHP_SP_ENTITY_ID: https://localhost
          SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: https://localhost/s/saml/login_check
          SIMPLESAMLPHP_IDP_BASE_URL: http://localhost:8086/simplesaml/
        ports:
          - 8086:8080

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: PHPUnit cache
        if: ${{matrix.php-versions == '8.2'}}
        uses: actions/cache@v4
        with:
          path: ./var/cache/phpunit
          key: ${{ runner.os }}-phpunit-${{ hashFiles('**/composer.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-phpunit-${{ hashFiles('**/composer.lock') }}
            ${{ runner.os }}-phpunit-

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, pdo_mysql, pgsql, pdo_pgsql, imap, gd
          coverage: pcov
          ini-values: pcov.enabled=0, pcov.directory=., pcov.exclude="~tests|themes|vendor~", zend.assertions=1

      - name: Install PostgreSQL client
        run: |
          # 1. Extract major version number (e.g., '19beta2-alpine' -> '19')
          VERSION=$(echo "${{ matrix.postgres-versions }}" | sed -E 's/([0-9.]+).*/\1/' | cut -d. -f1)

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release

          # 2. Pull and dearmor the official PGDG signing key
          sudo mkdir -p /usr/share/keyrings
          curl -fSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor | sudo tee /usr/share/keyrings/postgresql-archive-keyring.gpg > /dev/null

          # 3. Add the standard production repo first to test viability
          echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update

          # 4. Check if the package exists in the stable 'main' tracking repo
          if ! apt-cache show "postgresql-client-$VERSION" > /dev/null 2>&1; then
            echo "Package postgresql-client-$VERSION not found in main. Switching to development snapshots..."

            # Reconfigure for development/pre-release snapshots
            echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg-snapshot main $VERSION" | sudo tee /etc/apt/sources.list.d/pgdg.list

            # Elevate PGDG priority over Ubuntu default packages to force snapshot usage
            sudo tee /etc/apt/preferences.d/pgdg.pref <<EOF
          Package: *
          Pin: release o=apt.postgresql.org
          Pin-Priority: 800
          EOF

            # Final index update for the snapshot repository
            sudo apt-get update
          fi

          # 5. Install the package
          sudo apt-get install -o Dpkg::Options::="--force-overwrite" -y postgresql-client-$VERSION

      - name: Prepare PostgreSQL environment
        run: |
          # 1. Extract major version number (e.g., '19beta2-alpine' -> '19')
          VERSION=$(echo "${{ matrix.postgres-versions }}" | sed -E 's/([0-9.]+).*/\1/' | cut -d. -f1)
          
          export PATH="/usr/lib/postgresql/$VERSION/bin:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV
          pg_dump --version
          DB_LOG_NAME="$VERSION"
          echo "DB_LOG_NAME=${DB_LOG_NAME/:/_}" >> $GITHUB_ENV

      - name: Set SYMFONY_ENV to test
        run: |
          echo "SYMFONY_ENV=test" >> $GITHUB_ENV
          echo "MAUTIC_ENV=test" >> $GITHUB_ENV

      - name: Install dependencies
        # composer install cache - https://github.com/ramsey/composer-install
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          # Conditionally appends ignore platform rules ONLY for PHP 8.6 dev runs
          composer-options: ${{ matrix.php-versions == '8.6' && '--ignore-platform-reqs' || '' }}

      - name: Configure env for postgress
        run: |
          echo "DB_DRIVER=pdo_pgsql" > .env.test
          echo "DB_HOST=localhost" >> .env.test
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> .env.test
          echo "DB_NAME=mautictest" >> .env.test
          echo "DB_USER=mautic" >> .env.test
          echo "DB_PASSWD=mautic" >> .env.test
          echo "DB_CHARSET=UTF8" >> .env.test
          echo "MAUTIC_DB_PREFIX=test_" >> .env.test
          echo "MAUTIC_TABLE_PREFIX=test_" >> .env.test
          echo "MAUTIC_ENV=test" >> .env.test
          echo "MAUTIC_ADMIN_USERNAME=admin" >> .env.test
          echo "MAUTIC_ADMIN_PASSWORD=mautic" >> .env.test
          echo "SAML_HOST=localhost" >> .env.test
          echo "SAML_PORT=${{ job.services.saml.ports[8080] }}" >> .env.test

      - name: Run tests - database = postgres:${{ matrix.postgres-versions }}
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          DB_DRIVER: pdo_pgsql
          DB_CHARSET: UTF8
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_USER: mautic
          DB_PASSWD: mautic
          DB_NAME: mautictest
          SYMFONY_ENV: test
          MAUTIC_ENV: test
          PGPASSWORD: mautic
        run: |
          rm -rf var/cache

          export DB_PORT="${{ job.services.postgres.ports[5432] }}"
          export SAML_PORT="${{ job.services.saml.ports[8080] }}"

          php -d zend.assertions=1 bin/phpunit -d memory_limit=2G --bootstrap vendor/autoload.php --configuration app/phpunit.xml.dist

      - name: Store log artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-postgres-${{ matrix.php-versions }}-postgres_${{ matrix.postgres-versions }}
          path: ./var/logs/*

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup DDEV
      uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1

    - name: Set up environment variables for test mode
      run: echo -e "APP_ENV=test\nAPP_DEBUG=1" > .env.local

    - name: Run E2E tests
      run: ddev exec composer e2e-test

    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-test-screenshots
        path: tests/_output
        if-no-files-found: ignore

  misc:
    # We don't want the scheduled jobs to run on forks of Mautic
    if: (github.event_name == 'schedule' && (github.repository == 'mautic/mautic' || github.repository == 'mautic/api-library') ) || (github.event_name != 'schedule')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        commands: ['PHPSTAN', 'CS Fixer', 'Rector', 'Twig Lint', 'scaffolded files mismatch', 'composer install', 'composer lock check']
        php-versions: ['8.2']

    name: ${{ matrix.commands }} - ${{ matrix.php-versions }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Rector Cache
      if: ${{matrix.commands == 'Rector'}}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./var/cache/rector
        key: ${{ runner.os }}-rector-${{ hashFiles('**/composer.lock') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-rector-${{ hashFiles('**/composer.lock') }}
          ${{ runner.os }}-rector-

    - name: PHPStan Cache
      if: ${{matrix.commands == 'PHPSTAN'}}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./var/phpstan-cache
        key: ${{ runner.os }}-phpstan-${{ hashFiles('**/composer.lock') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-phpstan-${{ hashFiles('**/composer.lock') }}
          ${{ runner.os }}-phpstan-

    - name: NPM Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./var/cache/js
        key: ${{ runner.os }}-js-${{ hashFiles('**/package-lock.json', 'webpack.config.js') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-js-${{ hashFiles('**/package-lock.json', 'webpack.config.js') }}
          ${{ runner.os }}-js-

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6

    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, pdo_mysql

    - name: Install dependencies
      uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
      env:
        NPM_CONFIG_CACHE: ./var/cache/js/npm

    - name: Run ${{ matrix.commands }}
      run: |
        if [[ "${{ matrix.commands }}" == "PHPSTAN" ]]; then
          export SYMFONY_ENV=dev
          export APP_ENV=dev
          export APP_DEBUG=1
          composer phpstan -- --no-progress
        elif [[ "${{ matrix.commands }}" == "Rector" ]]; then
          export SYMFONY_ENV=test
          bin/console cache:warmup
          bin/rector --dry-run --ansi
        elif [[ "${{ matrix.commands }}" == "Twig Lint" ]]; then
          bin/console lint:twig app plugins
        elif [[ "${{ matrix.commands }}" == "CS Fixer" ]]; then
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ $file == *.php ]]; then
              cs_fix_files="${cs_fix_files} $file"
            fi
          done
          if [[ $cs_fix_files ]]; then
            bin/php-cs-fixer fix --config=.php-cs-fixer.php --dry-run --using-cache=no --show-progress=dots --diff $cs_fix_files
          fi
        elif [[ "${{ matrix.commands }}" == "scaffolded files mismatch" ]]; then
          wget -q -O /tmp/jq https://github.com/stedolan/jq/releases/download/jq-1.6/jq-linux64 && chmod 755 /tmp/jq
          /tmp/jq -r '.extra["mautic-scaffold"]["file-mapping"] | to_entries[] | "diff -q \(.key | sub("\\[(project|web)-root\\]";".")) app/\(.value)"' app/composer.json > diff_commands.sh
          /tmp/jq -r '.extra["mautic-scaffold"]["file-mapping"] | to_entries[] | "diff -rui \(.key | sub("\\[(project|web)-root\\]";".")) app/\(.value)"' app/composer.json > diff_commands_verbose.sh
          bash diff_commands.sh 2>&1 | tee /tmp/diff_command_output.txt
          rm diff_commands.sh
          if [[ $(wc -l </tmp/diff_command_output.txt) -ge 1 ]]; then
            echo "some scaffolded files were not updated or deleted"
            echo "Please apply the same changes in the files mentioned above"
            echo "verbose diff:"
            bash diff_commands_verbose.sh
            exit 1
          fi
        elif [[ "${{ matrix.commands }}" == "composer install" ]]; then
          # create a temp dir and mimic a composer install via mautic/recommended-project
          mkdir test_composer
          cd test_composer
          cp ../.github/ci-files/composer.json ./
          composer install

          # test if media/css and media/js folder contain the same files as the tarball releases
          test -z "$(comm -23 <(ls ../media/js  | sort) <(ls docroot/media/js  | sort))"
          test -z "$(comm -23 <(ls ../media/css | sort) <(ls docroot/media/css | sort))"

          # test if console is executable
          ./bin/console cache:clear

          # test that local_root is auto-detected from composer.json's mautic-scaffold.locations.web-root
          # This ensures ElFinder and other webroot-relative paths resolve correctly for recommended-project
          php -r "
            require 'vendor/autoload.php';
            \$projectRoot = getcwd();
            \$webrootDir = Mautic\CoreBundle\Loader\ParameterLoader::getWebrootDir(\$projectRoot);
            if (\$webrootDir !== \$projectRoot . '/docroot') {
              echo \"ERROR: Expected webroot to be {\$projectRoot}/docroot, got {\$webrootDir}\n\";
              exit(1);
            }
            echo \"OK: Webroot correctly auto-detected as {\$webrootDir}\n\";
          "
        elif [[ "${{ matrix.commands }}" == "composer lock check" ]]; then
          composer validate --ansi
        else
          echo "Invalid command"
          exit 1
        fi

    - name: Slack Notification if tests fail
      uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2
      if: ${{ failure() && github.event_name == 'schedule' }}
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_MESSAGE: 'The daily GitHub Actions tests in mautic/mautic have failed. Most likely something external has changed, like a PHP version update.'
