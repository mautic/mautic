name: Build JS files for dist folder

on:
  pull_request:
    paths:
      - 'plugins/GrapesJsBuilderBundle/**'
  # Allow manually triggering this workflow
  workflow_dispatch:

defaults:
  run:
    working-directory: plugins/GrapesJsBuilderBundle

permissions:
  contents: read

jobs:
  build-js:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - name: Install dependencies
      run: npm ci
    # The dist files are not tracked in git; this verifies the build succeeds.
    - name: Build JS dist files
      run: npm run build
