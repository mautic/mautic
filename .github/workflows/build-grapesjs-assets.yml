name: Build JS files for dist folder

on:
  pull_request:
    paths:
      - 'plugins/GrapesJsBuilderBundle/**'
  # Allow manually triggering this workflow
  workflow_dispatch:

defaults:
  run:
    working-directory: plugins/GrapesJsBuilderBundle

permissions:
  contents: read

jobs:
  build-js:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '24'
    - name: Install dependencies
      run: npm ci
    # The dist files are not tracked in git; this verifies the build succeeds.
    - name: Build JS dist files
      run: npm run build
