version: '3.9'

services:
  mautic:
    build: .
    container_name: mautic
    restart: unless-stopped
    environment:
      - MAUTIC_URL=${MAUTIC_URL:-http://localhost:8000}
      - MAUTIC_DB_HOST=db
      - MAUTIC_DB_PORT=3306
      - MAUTIC_DB_NAME=${MYSQL_DATABASE}
      - MAUTIC_DB_USER=${MYSQL_USER}
      - MAUTIC_DB_PASSWORD=${MYSQL_PASSWORD}
      - MAUTIC_ADMIN_USERNAME=${MAUTIC_ADMIN_USERNAME}
      - MAUTIC_ADMIN_PASSWORD=${MAUTIC_ADMIN_PASSWORD}
      - MAUTIC_ADMIN_EMAIL=${MAUTIC_ADMIN_EMAIL}
      - MAUTIC_ADMIN_FIRSTNAME=${MAUTIC_ADMIN_FIRSTNAME}
      - MAUTIC_ADMIN_LASTNAME=${MAUTIC_ADMIN_LASTNAME}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-256M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-256M}
    ports:
      - "8000:80"
    volumes:
      - mautic_config:/var/www/html/config
      - mautic_var:/var/www/html/var
      - mautic_media:/var/www/html/media
    depends_on:
      - db
    networks:
      - mautic-network

  db:
    image: mariadb:10.11
    container_name: mautic_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mautic_db:/var/lib/mysql
    networks:
      - mautic-network

  redis:
    image: redis:7-alpine
    container_name: mautic_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - mautic_redis:/data
    networks:
      - mautic-network

volumes:
  mautic_config:
  mautic_var:
  mautic_media:
  mautic_db:
  mautic_redis:

networks:
  mautic-network:
    driver: bridge
